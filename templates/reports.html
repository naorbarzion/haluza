<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>דוחות נסיעה - Tracer</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- FullCalendar -->
    <link href='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css' rel='stylesheet' />
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js'></script>
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/locales/he.js'></script>
    
    <!-- Flatpickr -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/he.js"></script>
    
    <!-- Tippy.js for tooltips -->
    <script src="https://unpkg.com/@popperjs/core@2"></script>
    <script src="https://unpkg.com/tippy.js@6"></script>
    <link rel="stylesheet" href="https://unpkg.com/tippy.js@6/dist/tippy.css" />
    
    <style>
        /* Custom styles */
        .glass-effect {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        /* FullCalendar RTL fixes */
        .fc {
            direction: rtl;
        }

        /* FullCalendar Custom Styles */
        .fc {
            direction: rtl;
            text-align: right;
        }

        .fc-event {
            cursor: pointer;
            padding: 4px 6px !important;
            margin-bottom: 2px !important;
            border-radius: 4px !important;
            font-size: 0.875rem !important;
            min-height: 40px !important;
        }

        .fc-event.approved {
            background-color: rgba(220, 252, 231, 0.9) !important;
            border-color: #22c55e !important;
            color: #166534 !important;
        }

        .fc-event.pending {
            background-color: rgba(254, 249, 195, 0.9) !important;
            border-color: #eab308 !important;
            color: #854d0e !important;
        }

        .fc-event.rejected {
            background-color: rgba(254, 226, 226, 0.9) !important;
            border-color: #ef4444 !important;
            color: #991b1b !important;
        }

        .fc-daygrid-event {
            white-space: normal !important;
            display: flex !important;
            flex-direction: column !important;
            justify-content: center !important;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <!-- Header -->
    <header class="bg-white shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-4">
            <div class="flex justify-between items-center">
                <img src="https://tracer.co.il/wp-content/uploads/elementor/thumbs/Logo-H-p8d906f0bmrgobnn9uwquzibery89mtbvr1plpc910.png" 
                     alt="Tracer Logo" 
                     class="h-12">
                
                <div class="flex items-center gap-4">
                    <div class="text-lg font-medium text-gray-700">
                        <i class="fas fa-user-shield text-blue-600 ml-2"></i>
                        <span>{{ full_name }}</span>
                    </div>
                    <a href="{{ url_for('admin_dashboard') }}" 
                       class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition-colors flex items-center gap-2">
                        <i class="fas fa-arrow-right"></i>
                        חזרה לדשבורד
                    </a>
                    <a href="{{ url_for('logout') }}" 
                       class="bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-600 transition-colors flex items-center gap-2">
                        <i class="fas fa-sign-out-alt"></i>
                        התנתק
                    </a>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        <!-- Filters Section -->
        <div class="glass-effect rounded-2xl shadow-lg p-8 mb-8 fade-in">
            <div class="flex items-center gap-3 mb-6">
                <div class="bg-blue-100 p-3 rounded-lg">
                    <i class="fas fa-filter text-blue-600 text-xl"></i>
                </div>
                <h2 class="text-2xl font-bold">סינון והורדת דוחות</h2>
            </div>
            
            <form id="searchForm" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <!-- בחירת נהג -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">
                            <i class="fas fa-user ml-2"></i>בחירת נהג
                        </label>
                        <select id="driverSelect" class="w-full rounded-lg border-gray-300 focus:border-blue-500 focus:ring-blue-500">
                            <option value="">כל הנהגים</option>
                        </select>
                    </div>

                    <!-- בחירת רכב -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">
                            <i class="fas fa-car ml-2"></i>בחירת רכב
                        </label>
                        <select id="vehicleSelect" class="w-full rounded-lg border-gray-300 focus:border-blue-500 focus:ring-blue-500">
                            <option value="">כל הרכבים</option>
                            <option value="car1">יונדאי איוניק - 53836402</option>
                            <option value="car2">טויוטה סיטי - 15093804</option>
                            <option value="car3">מרצדס בנץ - 19826603</option>
                        </select>
                    </div>

                    <!-- סטטוס -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">
                            <i class="fas fa-check-circle ml-2"></i>סטטוס
                        </label>
                        <select id="statusSelect" class="w-full rounded-lg border-gray-300 focus:border-blue-500 focus:ring-blue-500">
                            <option value="">כל הסטטוסים</option>
                            <option value="pending">ממתין לאישור</option>
                            <option value="approved">מאושר</option>
                            <option value="rejected">נדחה</option>
                        </select>
                    </div>
                </div>

                <!-- תאריכים -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">
                            <i class="fas fa-calendar ml-2"></i>מתאריך
                        </label>
                        <input type="date" id="startDate" 
                               class="w-full rounded-lg border-gray-300 focus:border-blue-500 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">
                            <i class="fas fa-calendar ml-2"></i>עד תאריך
                        </label>
                        <input type="date" id="endDate" 
                               class="w-full rounded-lg border-gray-300 focus:border-blue-500 focus:ring-blue-500">
                    </div>
                </div>

                <!-- כפתורים -->
                <div class="flex justify-end gap-4">
                    <button type="button" id="searchBtn"
                            class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition-colors">
                        <i class="fas fa-search ml-2"></i>חפש
                    </button>
                    <button type="button" id="exportBtn"
                            class="px-4 py-2 bg-green-500 text-white rounded-lg hover:bg-green-600 transition-colors">
                        <i class="fas fa-file-excel ml-2"></i>ייצא לאקסל
                    </button>
                </div>
            </form>
        </div>

        <!-- Results Section -->
        <div class="glass-effect rounded-2xl shadow-lg p-8 mb-8 fade-in">
            <div class="flex items-center gap-3 mb-6">
                <div class="bg-blue-100 p-3 rounded-lg">
                    <i class="fas fa-list text-blue-600 text-xl"></i>
                </div>
                <h2 class="text-2xl font-bold">רשימת נסיעות</h2>
            </div>
            
            <div id="tripsContainer" class="space-y-4">
                <!-- הנסיעות יוצגו כאן -->
            </div>
        </div>

        <!-- Calendar Section -->
        <div class="glass-effect rounded-2xl shadow-lg p-8 fade-in">
            <div class="flex items-center gap-3 mb-6">
                <div class="bg-indigo-100 p-3 rounded-lg">
                    <i class="fas fa-calendar-alt text-indigo-600 text-xl"></i>
                </div>
                <h2 class="text-2xl font-bold">לוח נסיעות</h2>
            </div>
            
            <div id="calendar" class="bg-white rounded-lg p-4"></div>
        </div>
    </main>

    <!-- Event Details Modal -->
    <div id="eventModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center">
        <div class="bg-white rounded-2xl p-6 max-w-lg w-full mx-4">
            <div class="flex justify-between items-start mb-4">
                <h3 class="text-xl font-bold" id="modalTitle"></h3>
                <button onclick="closeModal()" class="text-gray-500 hover:text-gray-700">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div id="modalContent" class="space-y-4"></div>
            <div class="mt-6 flex justify-end">
                <button onclick="closeModal()" 
                        class="bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600 transition-colors">
                    סגור
                </button>
            </div>
        </div>
    </div>

    <script>
        let calendar;

        // אתחול הקלנדר והפילטרים
        document.addEventListener('DOMContentLoaded', function() {
            // אתחול בחירת תאריכים
            flatpickr("#dateFrom, #dateTo", {
                locale: "he",
                dateFormat: "Y-m-d",
                enableTime: false
            });

            // אתחול הקלנדר
            const calendarEl = document.getElementById('calendar');
            const calendar = new FullCalendar.Calendar(calendarEl, {
                locale: 'he',
                direction: 'rtl',
                initialView: 'dayGridMonth',
                headerToolbar: {
                    right: 'prev,next today',
                    center: 'title',
                    left: 'dayGridMonth,timeGridWeek,timeGridDay'
                },
                buttonText: {
                    today: 'היום',
                    month: 'חודש',
                    week: 'שבוע',
                    day: 'יום'
                },
                eventDidMount: function(info) {
                    // הוספת קלאס לפי סטטוס
                    info.el.classList.add(info.event.extendedProps.status);
                    
                    // הוספת טולטיפ מפורט
                    tippy(info.el, {
                        content: `
                            <div class="text-right p-2">
                                <div class="font-bold mb-1">${info.event.extendedProps.driver_name || 'לא צוין'}</div>
                                <div class="text-sm">
                                    <div>רכב: ${getVehicleName(info.event.extendedProps.vehicle)}</div>
                                    <div>מטרה: ${info.event.title}</div>
                                    <div>התחלה: ${formatDateTime(info.event.start)}</div>
                                    <div>סיום: ${formatDateTime(info.event.end)}</div>
                                </div>
                            </div>
                        `,
                        allowHTML: true,
                        placement: 'top',
                        interactive: true,
                        theme: 'light'
                    });
                },
                eventContent: function(arg) {
                    return {
                        html: `
                            <div class="fc-content">
                                <div class="font-bold">${arg.event.extendedProps.driver_name || 'לא צוין'}</div>
                                <div class="text-sm">${arg.event.title}</div>
                            </div>
                        `
                    };
                }
            });
            
            calendar.render();
            window.calendar = calendar;  // שמירת הקלנדר כמשתנה גלובלי
            loadDrivers();
            searchTrips();
        });

        // טעינת נהגים
        async function loadDrivers() {
            try {
                const response = await fetch('/admin/get_drivers');
                const drivers = await response.json();
                const select = document.getElementById('driverSelect');
                
                drivers.forEach(driver => {
                    const option = document.createElement('option');
                    option.value = driver.id;
                    option.textContent = driver.full_name;
                    select.appendChild(option);
                });
            } catch (error) {
                console.error('Error loading drivers:', error);
                showNotification('שגיאה בטעינת רשימת הנהגים', 'error');
            }
        }

        // חיפוש והצגת נסיעות
        async function searchTrips() {
            try {
                const container = document.getElementById('tripsContainer');
                if (!container) {
                    console.error('Container not found!');
                    return;
                }

                container.innerHTML = `
                    <div class="flex justify-center items-center py-8">
                        <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
                        <span class="mr-3">טוען נסיעות...</span>
                    </div>
                `;

                const formData = {
                    driver_id: document.getElementById('driverSelect')?.value || '',
                    vehicle: document.getElementById('vehicleSelect')?.value || '',
                    status: document.getElementById('statusSelect')?.value || '',
                    start_date: document.getElementById('startDate')?.value || '',
                    end_date: document.getElementById('endDate')?.value || ''
                };

                console.log('Search form data:', formData);  // לוג לדיבוג

                const response = await fetch('/admin/search_trips', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                if (!response.ok) {
                    throw new Error('שגיאה בטעינת הנסיעות');
                }

                const trips = await response.json();
                console.log('Received trips:', trips);  // לוג לדיבוג

                displayTrips(trips);
                updateCalendar(trips);

            } catch (error) {
                console.error('Error searching trips:', error);
                const container = document.getElementById('tripsContainer');
                if (container) {
                    container.innerHTML = `
                        <div class="text-center text-red-500 py-8">
                            <i class="fas fa-exclamation-circle text-xl mb-2"></i>
                            <div>אירעה שגיאה בטעינת הנסיעות</div>
                            <div class="text-sm">${error.message}</div>
                        </div>
                    `;
                }
                showNotification(error.message, 'error');
            }
        }

        // עדכון הקלנדר
        function updateCalendar(trips) {
            if (!window.calendar) return;
            
            window.calendar.removeAllEvents();
            
            const events = trips.map(trip => ({
                id: trip._id,
                title: trip.purpose,
                start: normalizeDate(trip.date_time),
                end: normalizeDate(trip.end_time),
                extendedProps: {
                    driver_name: trip.driver_name,
                    vehicle: trip.vehicle,
                    status: trip.status,
                    purpose: trip.purpose,
                    destination: trip.destination
                }
            }));
            
            window.calendar.addEventSource(events);
        }

        // הצגת פרטי נסיעה
        function showEventDetails(event) {
            const modal = document.getElementById('eventModal');
            const title = document.getElementById('modalTitle');
            const content = document.getElementById('modalContent');
            
            title.textContent = 'פרטי נסיעה';
            content.innerHTML = `
                <div class="space-y-3">
                    <p><strong>נהג:</strong> ${event.extendedProps.driver_name}</p>
                    <p><strong>רכב:</strong> ${event.extendedProps.vehicleName}</p>
                    <p><strong>תאריך ושעה:</strong> ${formatDateTime(event.start)}</p>
                    <p><strong>מטרה:</strong> ${event.extendedProps.purpose}</p>
                    <p><strong>יעד:</strong> ${event.extendedProps.destination || 'לא צוין'}</p>
                    <p><strong>סטטוס:</strong> 
                        <span class="px-2 py-1 rounded-full text-sm font-medium ${getStatusBadgeClass(event.extendedProps.status)}">
                            ${getStatusText(event.extendedProps.status)}
                        </span>
                    </p>
                    ${event.extendedProps.rejection_reason ? `
                        <div class="mt-2 p-3 bg-red-50 text-red-700 rounded-lg">
                            <strong>סיבת דחייה:</strong> ${event.extendedProps.rejection_reason}
                        </div>
                    ` : ''}
                </div>
            `;
            
            modal.classList.remove('hidden');
        }

        // סגירת המודל
        function closeModal() {
            document.getElementById('eventModal').classList.add('hidden');
        }

        // ייצוא לאקסל
        async function exportToExcel() {
            try {
                const formData = {
                    driver_id: document.getElementById('driverSelect')?.value || '',
                    vehicle: document.getElementById('vehicleSelect')?.value || '',
                    status: document.getElementById('statusSelect')?.value || '',
                    start_date: document.getElementById('startDate')?.value || '',
                    end_date: document.getElementById('endDate')?.value || ''
                };

                const response = await fetch('/admin/export_trips', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                if (!response.ok) {
                    throw new Error('שגיאה בייצוא הנסיעות');
                }

                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `trips_report_${new Date().toISOString().slice(0,10)}.xlsx`;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                a.remove();

                showNotification('הדוח יוצא בהצלחה', 'success');
            } catch (error) {
                console.error('Error exporting trips:', error);
                showNotification('שגיאה בייצוא הדוח', 'error');
            }
        }

        // Helper Functions
        function getVehicleName(vehicleCode) {
            const vehicles = {
                'car1': 'יונדאי איוניק - 53836402',
                'car2': 'טויוטה סיטי - 15093804',
                'car3': 'מרצדס בנץ - 19826603'
            };
            return vehicles[vehicleCode] || vehicleCode;
        }

        function getStatusBadgeClass(status) {
            return {
                'pending': 'bg-yellow-100 text-yellow-800',
                'approved': 'bg-green-100 text-green-800',
                'rejected': 'bg-red-100 text-red-800'
            }[status] || 'bg-gray-100 text-gray-800';
        }

        function getStatusText(status) {
            return {
                'pending': 'ממתין לאישור',
                'approved': 'מאושר',
                'rejected': 'נדחה'
            }[status] || status;
        }

        function formatDateTime(dateStr) {
            if (!dateStr) return 'לא צוין';
            try {
                // אם התאריך מגיע בפורמט dd/mm/yyyy
                if (dateStr.includes('/')) {
                    const [day, month, year, time] = dateStr.split(/[/ ]/);
                    return `${day}/${month}/${year} ${time || ''}`.trim();
                }
                
                // אם התאריך מגיע בפורמט yyyy-mm-dd
                const date = new Date(dateStr);
                if (isNaN(date.getTime())) {
                    // אם התאריך לא תקין, נחזיר כמו שהוא
                    return dateStr;
                }
                
                return new Intl.DateTimeFormat('he-IL', {
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit'
                }).format(date);
            } catch (error) {
                console.error('Error formatting date:', error);
                // אם יש שגיאה, נחזיר את התאריך המקורי
                return dateStr;
            }
        }

        function formatTime(date) {
            return new Intl.DateTimeFormat('he-IL', {
                hour: '2-digit',
                minute: '2-digit'
            }).format(date);
        }

        function formatDateForFilename(date) {
            return date.toISOString().split('T')[0];
        }

        function showNotification(message, type) {
            const notification = document.createElement('div');
            notification.className = `fixed top-4 left-4 p-4 rounded-lg shadow-lg z-50 fade-in ${
                type === 'success' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'
            }`;
            
            notification.innerHTML = `
                <div class="flex items-center gap-2">
                    <i class="fas fa-${type === 'success' ? 'check' : 'exclamation'}-circle"></i>
                    ${message}
                </div>
            `;
            
            document.body.appendChild(notification);
            setTimeout(() => notification.remove(), 3000);
        }

        // Event Listeners
        document.getElementById('searchBtn')?.addEventListener('click', searchTrips);
        document.getElementById('exportBtn')?.addEventListener('click', exportToExcel);

        // Close modal when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('eventModal');
            if (event.target === modal) {
                closeModal();
            }
        }

        // נעדכן את פונקציית displayTrips
        function displayTrips(trips) {
            const container = document.getElementById('tripsContainer');
            if (!trips.length) {
                container.innerHTML = '<div class="text-center text-gray-500 py-8">לא נמצאו נסיעות</div>';
                return;
            }

            const html = trips.map(trip => `
                <div class="trip-card glass-effect rounded-xl p-6 mb-4">
                    <div class="flex justify-between items-start">
                        <div class="space-y-3">
                            <div class="flex items-center gap-2">
                                <div class="bg-blue-100 p-2 rounded">
                                    <i class="fas fa-car-side text-blue-600"></i>
                                </div>
                                <div>
                                    <div class="font-medium text-lg">${trip.driver_name}</div>
                                    <div class="text-gray-500">
                                        <div class="text-sm">רכב: ${getVehicleName(trip.vehicle)}</div>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- זמני הנסיעה -->
                            <div class="bg-gray-50 p-3 rounded-lg space-y-2">
                                <div class="flex items-center gap-2">
                                    <i class="fas fa-clock text-blue-600"></i>
                                    <div>
                                        <div class="text-sm text-gray-600">התחלה: ${formatDateTime(trip.date_time)}</div>
                                        <div class="text-sm text-gray-600">סיום: ${formatDateTime(trip.end_time)}</div>
                                        <div class="text-sm font-medium text-blue-600">
                                            משך מתוכנן: ${calculateDuration(trip.date_time, trip.end_time)}
                                        </div>
                                    </div>
                                </div>
                                
                                <!-- מטרה ויעד -->
                                <div>
                                    <div class="text-sm font-medium text-gray-700">מטרת הנסיעה:</div>
                                    <div class="text-sm text-gray-600">${trip.purpose}</div>
                                </div>
                                <div>
                                    <div class="text-sm font-medium text-gray-700">יעד:</div>
                                    <div class="text-sm text-gray-600">${trip.destination || 'לא צוין'}</div>
                                </div>
                            </div>
                            
                            <!-- סטטוס -->
                            <div class="flex items-center gap-2">
                                <div class="text-sm font-medium ${getStatusBadgeClass(trip.status)}">
                                    ${getStatusText(trip.status)}
                                </div>
                                ${trip.rejection_reason ? `
                                    <div class="text-sm text-red-600">
                                        <i class="fas fa-info-circle ml-1"></i>סיבת דחייה: ${trip.rejection_reason}
                                    </div>
                                ` : ''}
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');

            container.innerHTML = html;
        }

        // פונקציות עזר
        function calculateDuration(start, end) {
            try {
                const startTime = normalizeDate(start);
                const endTime = normalizeDate(end);
                
                if (!startTime || !endTime) {
                    return 'לא ניתן לחשב';
                }
                
                const diff = (endTime - startTime) / (1000 * 60); // הפרש בדקות
                const hours = Math.floor(diff / 60);
                const minutes = Math.floor(diff % 60);
                return `${hours} שעות ו-${minutes} דקות`;
            } catch (error) {
                console.error('Error calculating duration:', error);
                return 'לא ניתן לחשב';
            }
        }

        // נוסיף פונקציה לנירמול תאריכים
        function normalizeDate(dateStr) {
            if (!dateStr) return null;
            
            try {
                // מנקה רווחים מיותרים
                dateStr = dateStr.trim();
                
                // אם התאריך בפורמט dd/mm/yyyy HH:MM
                if (dateStr.includes('/')) {
                    const [datePart, timePart] = dateStr.split(' ');
                    const [day, month, year] = datePart.split('/');
                    const [hours, minutes] = (timePart || '00:00').split(':');
                    return new Date(year, month - 1, day, hours || 0, minutes || 0);
                }
                
                // אם התאריך בפורמט ISO עם T
                if (dateStr.includes('T')) {
                    return new Date(dateStr);
                }
                
                // אם התאריך בפורמט yyyy-mm-dd HH:MM:SS
                const dateTimeRegex = /(\d{4})-(\d{2})-(\d{2})(?:T|\s)(\d{2}):(\d{2})(?::(\d{2}))?(?:\.\d+)?/;
                const match = dateStr.match(dateTimeRegex);
                if (match) {
                    const [_, year, month, day, hours, minutes, seconds] = match;
                    return new Date(year, month - 1, day, hours, minutes, seconds || 0);
                }
                
                // אם התאריך בפורמט yyyy-mm-dd
                if (dateStr.includes('-')) {
                    const [year, month, day] = dateStr.split('-');
                    return new Date(year, month - 1, day);
                }
                
                throw new Error(`Invalid date format: ${dateStr}`);
            } catch (error) {
                console.error('Error normalizing date:', error, dateStr);
                return null;
            }
        }
    </script>

<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ניהול נסיעות - Tracer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Rubik', sans-serif;
            background-color: #f8fafc;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
        }

        .trip-card {
            transition: all 0.3s ease;
        }

        .trip-card:hover {
            transform: translateY(-2px);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .slide-in {
            animation: slideIn 0.5s ease-out forwards;
        }

        .modal-overlay {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        .date-picker {
            border: 1px solid #e2e8f0;
            border-radius: 0.5rem;
            padding: 0.5rem;
            width: 100%;
        }

        .date-picker:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.1);
        }
    </style>
</head>
<body>
<!-- Header -->
<header class="bg-white shadow-sm">
    <div class="max-w-7xl mx-auto px-4 py-4">
        <div class="flex justify-between items-center">
            <img src="https://tracer.co.il/wp-content/uploads/elementor/thumbs/Logo-H-p8d906f0bmrgobnn9uwquzibery89mtbvr1plpc910.png" 
                 alt="Tracer Logo" 
                 class="h-12">
            
            <div class="flex items-center gap-4">
                <div class="text-lg font-medium text-gray-700">
                    <i class="fas fa-user-shield text-blue-600 ml-2"></i>
                    <span>{{ full_name }}</span>
                </div>
                <!-- כפתור דוחות -->
                <a href="{{ url_for('reports') }}" 
                   class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition-colors flex items-center gap-2">
                    <i class="fas fa-chart-bar ml-1"></i>
                    דוחות
                </a>
                <a href="{{ url_for('logout') }}" 
                   class="bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-600 transition-colors flex items-center gap-2">
                    <i class="fas fa-sign-out-alt"></i>
                    התנתק
                </a>
            </div>
        </div>
    </div>
</header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        <!-- Stats Overview -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="glass-card rounded-xl p-6">
                <div class="flex items-center gap-4">
                    <div class="bg-blue-100 p-3 rounded-lg">
                        <i class="fas fa-clock text-blue-600 text-xl"></i>
                    </div>
                    <div>
                        <h3 class="text-sm text-gray-600">ממתינות לאישור</h3>
                        <p class="text-2xl font-bold" id="pendingCount">0</p>
                    </div>
                </div>
            </div>
            
            <div class="glass-card rounded-xl p-6">
                <div class="flex items-center gap-4">
                    <div class="bg-green-100 p-3 rounded-lg">
                        <i class="fas fa-check text-green-600 text-xl"></i>
                    </div>
                    <div>
                        <h3 class="text-sm text-gray-600">נסיעות מאושרות</h3>
                        <p class="text-2xl font-bold" id="approvedCount">0</p>
                    </div>
                </div>
            </div>
            
            <div class="glass-card rounded-xl p-6">
                <div class="flex items-center gap-4">
                    <div class="bg-purple-100 p-3 rounded-lg">
                        <i class="fas fa-car text-purple-600 text-xl"></i>
                    </div>
                    <div>
                        <h3 class="text-sm text-gray-600">סה"כ נסיעות</h3>
                        <p class="text-2xl font-bold" id="totalCount">0</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Pending and Approved Trips -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <!-- Pending Trips -->
            <div class="glass-card rounded-xl p-6">
                <div class="flex items-center gap-3 mb-6">
                    <div class="bg-yellow-100 p-3 rounded-lg">
                        <i class="fas fa-hourglass-half text-yellow-600 text-xl"></i>
                    </div>
                    <h2 class="text-2xl font-bold">נסיעות ממתינות</h2>
                </div>
                <div id="pendingTrips" class="space-y-4">
                    <!-- Pending trips will be loaded here -->
                </div>
            </div>

            <!-- Approved Trips -->
            <div class="glass-card rounded-xl p-6">
                <div class="flex items-center gap-3 mb-6">
                    <div class="bg-green-100 p-3 rounded-lg">
                        <i class="fas fa-calendar-check text-green-600 text-xl"></i>
                    </div>
                    <h2 class="text-2xl font-bold">נסיעות מאושרות</h2>
                </div>
                <div id="approvedTrips" class="space-y-4">
                    <!-- Approved trips will be loaded here -->
                </div>
            </div>
        </div>
    </main>

    <!-- Reject Modal -->
    <div id="rejectModal" class="hidden fixed inset-0 z-50">
        <div class="modal-overlay absolute inset-0"></div>
        <div class="fixed inset-0 flex items-center justify-center">
            <div class="bg-white rounded-xl p-6 max-w-lg w-full mx-4 shadow-2xl">
                <h3 class="text-xl font-bold mb-4">דחיית נסיעה</h3>
                <form id="rejectForm" class="space-y-4">
                    <input type="hidden" id="rejectTripId">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">סיבת דחייה</label>
                        <textarea id="rejectionReason" 
                                  class="w-full rounded-lg border-gray-300 focus:border-blue-500 focus:ring-blue-500"
                                  rows="3" required></textarea>
                    </div>
                    <div class="flex justify-end gap-4">
                        <button type="button" 
                                onclick="closeRejectModal()"
                                class="px-4 py-2 rounded-lg border border-gray-300 hover:bg-gray-50 transition-colors">
                            ביטול
                        </button>
                        <button type="submit"
                                class="px-4 py-2 rounded-lg bg-red-500 text-white hover:bg-red-600 transition-colors">
                            דחה נסיעה
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Reschedule Modal -->
    <div id="rescheduleModal" class="hidden fixed inset-0 z-50">
        <div class="modal-overlay absolute inset-0"></div>
        <div class="fixed inset-0 flex items-center justify-center">
            <div class="bg-white rounded-xl p-6 max-w-lg w-full mx-4 shadow-2xl">
                <h3 class="text-xl font-bold mb-4">שינוי מועד נסיעה</h3>
                <form id="rescheduleForm" class="space-y-4">
                    <input type="hidden" id="rescheduleTripId">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">מועד חדש</label>
                        <input type="datetime-local" 
                               id="newDateTime" 
                               class="date-picker" 
                               required>
                    </div>
                    <div class="flex justify-end gap-4">
                        <button type="button" 
                                onclick="closeRescheduleModal()"
                                class="px-4 py-2 rounded-lg border border-gray-300 hover:bg-gray-50 transition-colors">
                            ביטול
                        </button>
                        <button type="submit"
                                class="px-4 py-2 rounded-lg bg-blue-500 text-white hover:bg-blue-600 transition-colors">
                            עדכן מועד
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        const VEHICLES = {
            'car1': 'טויוטה קורולה - 12-345-67',
            'car2': 'יונדאי i35 - 23-456-78',
            'car3': 'סקודה אוקטביה - 34-567-89'
        };

        async function loadTrips() {
            try {
                const response = await fetch('/admin/get_trips');
                const data = await response.json();
                
                // Update stats
                const stats = {
                    pending: data.filter(t => t.status === 'pending').length,
                    approved: data.filter(t => t.status === 'approved').length,
                    total: data.length
                };

                document.getElementById('pendingCount').textContent = stats.pending;
                document.getElementById('approvedCount').textContent = stats.approved;
                document.getElementById('totalCount').textContent = stats.total;

                // Render pending trips
                const pendingTrips = data.filter(t => t.status === 'pending');
                document.getElementById('pendingTrips').innerHTML = pendingTrips.map((trip, index) => `
                    <div class="trip-card glass-card rounded-xl p-6 slide-in" style="animation-delay: ${index * 0.1}s">
                        <div class="flex justify-between items-start">
                            <div class="space-y-3">
                                <div class="flex items-center gap-2">
                                    <img src="https://ui-avatars.com/api/?name=${encodeURIComponent(trip.driver_name)}&background=random" 
                                         class="w-10 h-10 rounded-full">
                                    <div>
                                        <div class="font-medium">${trip.driver_name}</div>
                                        <div class="text-sm text-gray-500">${VEHICLES[trip.vehicle]}</div>
                                    </div>
                                </div>
                                <div class="bg-gray-50 p-3 rounded-lg">
                                    <div class="text-sm text-gray-600">${trip.purpose}</div>
                                    <div class="mt-2 text-sm font-medium">
                                        <i class="far fa-calendar ml-1"></i>${formatDateTime(trip.date_time)}
                                    </div>
                                </div>
                            </div>
                            <div class="flex flex-col gap-2">
                                <button onclick="approveTrip(${trip.id})"
                                        class="px-4 py-2 rounded-lg bg-green-500 text-white hover:bg-green-600 transition-colors">
                                    <i class="fas fa-check ml-1"></i>אשר
                                </button>
                                <button onclick="showRejectModal(${trip.id})"
                                        class="px-4 py-2 rounded-lg bg-red-500 text-white hover:bg-red-600 transition-colors">
                                    <i class="fas fa-times ml-1"></i>דחה
                                </button>
                                <button onclick="showRescheduleModal(${trip.id}, '${trip.date_time}')"
                                        class="px-4 py-2 rounded-lg bg-blue-500 text-white hover:bg-blue-600 transition-colors">
                                    <i class="fas fa-clock ml-1"></i>שנה מועד
                                </button>
                            </div>
                        </div>
                    </div>
                `).join('') || '<div class="text-center text-gray-500 py-8">אין נסיעות ממתינות</div>';

                // Render approved trips
                const approvedTrips = data
                    .filter(t => t.status === 'approved')
                    .sort((a, b) => new Date(a.date_time) - new Date(b.date_time));

                    document.getElementById('approvedTrips').innerHTML = approvedTrips.map((trip, index) => `
    <div class="trip-card glass-card rounded-xl p-6 slide-in" style="animation-delay: ${index * 0.1}s">
        <div class="flex justify-between items-center">
            <div class="flex gap-4">
                <div class="bg-green-100 p-2 rounded-lg">
                    <i class="fas fa-check text-green-600"></i>
                </div>
                <div>
                    <div class="flex items-center gap-2">
                        <img src="https://ui-avatars.com/api/?name=${encodeURIComponent(trip.driver_name)}&background=random" 
                             class="w-8 h-8 rounded-full">
                        <div class="font-medium">${trip.driver_name}</div>
                    </div>
                    <div class="text-sm text-gray-500">${VEHICLES[trip.vehicle]}</div>
                    <div class="mt-2 text-sm text-gray-600">${trip.purpose}</div>
                </div>
            </div>
            <div class="text-sm text-gray-700">
                <i class="far fa-calendar ml-1"></i>
                ${formatDateTime(trip.date_time)}
            </div>
        </div>
    </div>
`).join('') || '<div class="text-center text-gray-500 py-8">אין נסיעות מאושרות</div>';

            } catch (error) {
                console.error('Error loading trips:', error);
                showNotification('אירעה שגיאה בטעינת הנסיעות', 'error');
            }
        }

        // Approve trip
        async function approveTrip(tripId) {
            try {
                const response = await fetch('/admin/update_trip_status', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        trip_id: tripId,
                        status: 'approved'
                    })
                });

                if (response.ok) {
                    showNotification('הנסיעה אושרה בהצלחה', 'success');
                    loadTrips();
                } else {
                    throw new Error('Failed to approve trip');
                }
            } catch (error) {
                showNotification('אירעה שגיאה באישור הנסיעה', 'error');
            }
        }

        // Reject trip
        function showRejectModal(tripId) {
            document.getElementById('rejectTripId').value = tripId;
            document.getElementById('rejectModal').classList.remove('hidden');
        }

        function closeRejectModal() {
            document.getElementById('rejectModal').classList.add('hidden');
            document.getElementById('rejectForm').reset();
        }

        document.getElementById('rejectForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const tripId = document.getElementById('rejectTripId').value;
            const reason = document.getElementById('rejectionReason').value;

            try {
                const response = await fetch('/admin/update_trip_status', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        trip_id: tripId,
                        status: 'rejected',
                        rejection_reason: reason
                    })
                });

                if (response.ok) {
                    showNotification('הנסיעה נדחתה', 'success');
                    closeRejectModal();
                    loadTrips();
                } else {
                    throw new Error('Failed to reject trip');
                }
            } catch (error) {
                showNotification('אירעה שגיאה בדחיית הנסיעה', 'error');
            }
        });

        // Reschedule trip
        function showRescheduleModal(tripId, currentDateTime) {
            document.getElementById('rescheduleTripId').value = tripId;
            document.getElementById('newDateTime').value = currentDateTime.split('.')[0];
            document.getElementById('rescheduleModal').classList.remove('hidden');
        }

        function closeRescheduleModal() {
            document.getElementById('rescheduleModal').classList.add('hidden');
            document.getElementById('rescheduleForm').reset();
        }

        document.getElementById('rescheduleForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const tripId = document.getElementById('rescheduleTripId').value;
            const newDateTime = document.getElementById('newDateTime').value;

            try {
                const response = await fetch('/admin/reschedule_trip', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        trip_id: tripId,
                        new_date_time: newDateTime
                    })
                });

                if (response.ok) {
                    showNotification('מועד הנסיעה עודכן', 'success');
                    closeRescheduleModal();
                    loadTrips();
                } else {
                    throw new Error('Failed to reschedule trip');
                }
            } catch (error) {
                showNotification('אירעה שגיאה בעדכון מועד הנסיעה', 'error');
            }
        });

        // Helper functions
        function showNotification(message, type) {
            const notification = document.createElement('div');
            notification.className = `fixed top-4 left-4 p-4 rounded-lg shadow-lg z-50 slide-in
                ${type === 'success' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}`;
            
            notification.innerHTML = `
                <div class="flex items-center gap-2">
                    <i class="fas fa-${type === 'success' ? 'check' : 'exclamation'}-circle"></i>
                    ${message}
                </div>
            `;
            
            document.body.appendChild(notification);
            setTimeout(() => notification.remove(), 3000);
        }

        function formatDateTime(dateStr) {
            const date = new Date(dateStr);
            return new Intl.DateTimeFormat('he-IL', {
                dateStyle: 'medium',
                timeStyle: 'short'
            }).format(date);
        }

        // Load trips on page load
        document.addEventListener('DOMContentLoaded', loadTrips);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>מערכת רישום נסיעות - Tracer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Rubik', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Header -->
    <header class="bg-white shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-4">
            <div class="flex justify-between items-center">
                <!-- Logo -->
                <img src="https://tracer.co.il/wp-content/uploads/elementor/thumbs/Logo-H-p8d906f0bmrgobnn9uwquzibery89mtbvr1plpc910.png" 
                     alt="Tracer Logo" 
                     class="h-12">
                
                <!-- User Menu -->
                <div class="flex items-center gap-4">
                    <div class="text-lg font-medium text-gray-700">
                        <i class="fas fa-sun ml-2"></i>
                        <span class="greeting-text">{{ greeting }}</span>
                        <span class="user-name font-bold">{{ full_name }}</span>
                    </div>
                    <a href="{{ url_for('logout') }}" 
                       class="bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-600 transition-colors">
                        <i class="fas fa-sign-out-alt ml-2"></i>
                        התנתק
                    </a>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        <!-- Trip Form Card -->
        <div class="bg-white rounded-xl shadow-lg p-6 mb-8">
            <h2 class="text-2xl font-bold mb-6">הזמנת נסיעה חדשה</h2>
            
            <form id="tripForm" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">
                            <i class="fas fa-car ml-2"></i>בחירת רכב
                        </label>
                        <select name="vehicle" required
                                class="w-full rounded-lg border-gray-300 focus:border-blue-500 focus:ring-blue-500">
                            <option value="">בחר רכב</option>
                            <option value="car1">טויוטה קורולה - 12-345-67</option>
                            <option value="car2">יונדאי i35 - 23-456-78</option>
                            <option value="car3">סקודה אוקטביה - 34-567-89</option>
                        </select>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">
                            <i class="fas fa-clock ml-2"></i>תאריך ושעה
                        </label>
                        <input type="datetime-local" name="date_time" required
                               class="w-full rounded-lg border-gray-300 focus:border-blue-500 focus:ring-blue-500">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-info-circle ml-2"></i>מטרת הנסיעה
                    </label>
                    <textarea name="purpose" rows="3" required
                              class="w-full rounded-lg border-gray-300 focus:border-blue-500 focus:ring-blue-500"
                              placeholder="פרט את מטרת הנסיעה..."></textarea>
                </div>

                <button type="submit" 
                        class="w-full bg-blue-600 text-white py-3 px-6 rounded-lg hover:bg-blue-700 transition-colors">
                    <i class="fas fa-paper-plane ml-2"></i>
                    שלח בקשה
                </button>
            </form>
        </div>

        <!-- Trips History -->
        <div class="bg-white rounded-xl shadow-lg p-6">
            <h2 class="text-2xl font-bold mb-6">היסטוריית נסיעות</h2>
            <div id="tripsContainer" class="space-y-4">
                <!-- הנסיעות יוכנסו כאן דינמית -->
            </div>
        </div>
    </main>

    <script>
        // JavaScript for form submission and trips loading
        // [הקוד הקודם נשאר אותו דבר...]
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <base target="_top">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tracer - כניסה למערכת</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Rubik', sans-serif;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            min-height: 100vh;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glass {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }

        .float-in {
            animation: float-in 0.8s ease-out;
        }

        @keyframes float-in {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .input-group {
            position: relative;
            margin-bottom: 1.5rem;
        }

        .input-group input {
            width: 100%;
            padding: 0.75rem;
            padding-right: 2.5rem;
            border-radius: 0.5rem;
            border: 2px solid transparent;
            background: rgba(255, 255, 255, 0.9);
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .input-group i {
            position: absolute;
            right: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            color: #6b7280;
        }

        .login-button {
            background: linear-gradient(45deg, #3b82f6, #2563eb);
            transition: all 0.3s ease;
            transform-style: preserve-3d;
        }

        .login-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }

        .login-button:active {
            transform: translateY(0);
        }

        .error-shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }
    </style>
</head>
<body class="flex items-center justify-center p-4">
    <div class="w-full max-w-md float-in">
        <!-- Logo Container -->
        <div class="text-center mb-8">
            <img src="https://tracer.co.il/wp-content/uploads/elementor/thumbs/Logo-H-p8d906f0bmrgobnn9uwquzibery89mtbvr1plpc910.png" 
                 alt="Tracer Logo" 
                 class="h-16 mx-auto mb-4 hover:scale-105 transition-transform"
                 onerror="this.onerror=null; this.src='data:image/svg+xml,<svg xmlns=\'http://www.w3.org/2000/svg\'></svg>';">
        </div>

        <!-- Login Card -->
        <div class="glass rounded-2xl p-8 shadow-2xl">
            <h1 class="text-2xl font-bold text-gray-800 text-center mb-8">כניסה למערכת</h1>
            
            {% if error %}
            <div class="bg-red-100 border-r-4 border-red-500 text-red-700 p-4 rounded-lg mb-6 error-shake">
                <div class="flex items-center">
                    <i class="fas fa-exclamation-circle ml-2"></i>
                    <p>{{ error }}</p>
                </div>
            </div>
            {% endif %}

            <form method="POST" class="space-y-6">
                <div class="input-group">
                    <input type="text" 
                           id="username" 
                           name="username" 
                           placeholder="שם משתמש"
                           required
                           autocomplete="username">
                    <i class="fas fa-user"></i>
                </div>

                <div class="input-group">
                    <input type="password" 
                           id="password" 
                           name="password" 
                           placeholder="סיסמה"
                           required
                           autocomplete="current-password">
                    <i class="fas fa-lock"></i>
                </div>

                <button type="submit" 
                        class="login-button w-full py-3 px-4 rounded-lg text-white font-medium flex items-center justify-center gap-2">
                    <i class="fas fa-sign-in-alt ml-2"></i>
                    התחברות
                </button>
            </form>

            <div class="mt-6 text-center text-sm text-gray-600">
                <p class="flex items-center justify-center gap-2">
                    <i class="fas fa-info-circle"></i>
                    לבעיות התחברות, צור קשר עם מנהל המערכת
                </p>
            </div>
        </div>
    </div>

    <script>
        // Add visual feedback on form submission
        document.querySelector('form').addEventListener('submit', function(e) {
            const button = this.querySelector('button');
            button.innerHTML = `
                <svg class="animate-spin h-5 w-5 mr-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                מתחבר...
            `;
            button.disabled = true;
        });
    </script>
</body>
</html>
